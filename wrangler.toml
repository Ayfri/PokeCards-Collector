name = "pokecards-collector"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"

# Wrangler owns the DNS record for this hostname since the Pages project released it.
[[routes]]
pattern = "pokecards-collector.ayfri.com"
custom_domain = true

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[placement]
mode = "smart"
