name = "pokecards-collector"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-10-23"
# Without it, esbuild picks up the root tsconfig, whose `strict` implies `alwaysStrict`. esbuild 0.28.2 then hoists block-level functions
# out of their block as if the code were sloppy, so a minified snippet named `e` shadows Svelte's imported `e` and the home page 500s.
tsconfig = "tsconfig.worker.json"

# Deploying overwrites the dashboard settings with this file, so every setting has to live here.
workers_dev = true
preview_urls = true

# Wrangler owns the DNS record for this hostname. `zone_name` is forwarded to the custom-domain API even though
# wrangler's bundled JSON schema rejects it next to `custom_domain`.
[[routes]]
pattern = "pokecards-collector.ayfri.com"
custom_domain = true
zone_name = "ayfri.com"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# The catalogue snapshots the scraper Worker publishes: a manifest and the immutable objects it names. `remote = true` makes `vite dev` and
# `wrangler dev` read the real bucket instead of an empty local one, so dev needs `wrangler login`.
[[r2_buckets]]
binding = "CATALOGUE"
bucket_name = "pokecards-catalogue"
remote = true

# `enabled` is the logs toggle. Traces need their own toggle below until Cloudflare ties them to it behind a compatibility date.
[observability]
enabled = true

# Traces keep 10% of invocations, each one whole; logs, errors and Issues stay complete. Set it back to 1.0 to trace every invocation while chasing a bug.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Groups uncaught exceptions, 5xx responses and `console.error` calls into issues, with no SDK in the bundle.
[observability.issues]
enabled = true

[placement]
mode = "smart"
