# Daily TCGdex -> Supabase refresh, deployed apart from the site Worker:
#   bun run deploy:scraper
#   bunx wrangler secret put SUPABASE_SECRET_KEY -c wrangler.scraper.toml
#   bunx wrangler secret put SCRAPER_TRIGGER_TOKEN -c wrangler.scraper.toml
name = "pokecards-scraper"
main = "src/workers/scraper.ts"
compatibility_date = "2026-10-23"

[vars]
PUBLIC_SUPABASE_URL = "https://ptbwuqaqkqntmgmaqboq.supabase.co"

# A full pass is ~50k TCGdex calls plus the Supabase upserts, far over the 10k default.
[limits]
subrequests = 1_000_000

# `enabled` is the logs toggle. Traces need their own toggle below until Cloudflare ties them to it behind a compatibility date.
[observability]
enabled = true

[observability.traces]
enabled = true

# Groups uncaught exceptions and `console.error` calls of the Workflow steps into issues, with no SDK in the bundle.
[observability.issues]
enabled = true

# Runs the TCGdex reads from a Durable Object hinted to Western Europe (best effort), see `TcgdexReader` in src/workers/scraper.ts.
[[durable_objects.bindings]]
name = "TCGDEX_READER"
class_name = "TcgdexReader"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TcgdexReader"]

# `schedules` creates one Workflow instance per firing, so no `[triggers] crons` and no `scheduled` handler.
[[workflows]]
name = "pokecards-scrape"
binding = "SCRAPER"
class_name = "ScrapeWorkflow"
schedules = ["0 4 * * *"] # Every day, 04:00 UTC
