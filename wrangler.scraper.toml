# Daily TCGdex -> Supabase refresh that ends by publishing the catalogue to R2, deployed apart from the site Worker:
#   bunx wrangler r2 bucket create pokecards-catalogue --location weur
#   bun run deploy:scraper
#   bunx wrangler secret put SUPABASE_SECRET_KEY -c wrangler.scraper.toml
#   bunx wrangler secret put SCRAPER_TRIGGER_TOKEN -c wrangler.scraper.toml
#   bunx wrangler secret put CARDTRADER_TOKEN -c wrangler.scraper.toml
#   bunx wrangler secret put DISCORD_CATALOGUE_WEBHOOK -c wrangler.scraper.toml
# DISCORD_CATALOGUE_WEBHOOK is optional: it is the Discord channel that gets the catalogue report after a publish, and nothing is sent without it.
# `POST /publish` with `Authorization: Bearer $SCRAPER_TRIGGER_TOKEN` publishes the snapshots on demand, which the CLI does after every upload.
name = "pokecards-scraper"
main = "src/workers/scraper.ts"
compatibility_date = "2026-10-23"

[vars]
PUBLIC_SUPABASE_URL = "https://ptbwuqaqkqntmgmaqboq.supabase.co"

# A full pass makes tens of thousands of TCGdex calls plus the Supabase upserts, far over the 10k default.
[limits]
subrequests = 1_000_000
# A publish stringifies, gzips and hashes every catalogue table, far over the default CPU budget of an invocation.
cpu_ms = 300_000

# The published catalogue snapshots (`src/scrapers/publish.ts`). `remote = true` keeps `wrangler dev` on the real bucket.
[[r2_buckets]]
binding = "CATALOGUE"
bucket_name = "pokecards-catalogue"
remote = true

# `enabled` is the logs toggle. Traces need their own toggle below until Cloudflare ties them to it behind a compatibility date.
[observability]
enabled = true

# Every TCGdex request of a pass is a span, so the spans are nearly all of the Worker's events. Traces keep 10% of invocations,
# each one whole; logs, errors and Issues stay complete. Set it back to 1.0 to trace every invocation while chasing a bug.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Groups uncaught exceptions and `console.error` calls of the Workflow steps into issues, with no SDK in the bundle.
[observability.issues]
enabled = true

# Runs the TCGdex reads from a Durable Object hinted to Western Europe (best effort), see `TcgdexReader` in src/workers/scraper.ts.
[[durable_objects.bindings]]
name = "TCGDEX_READER"
class_name = "TcgdexReader"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TcgdexReader"]

# `schedules` creates one Workflow instance per firing, so no `[triggers] crons` and no `scheduled` handler.
[[workflows]]
name = "pokecards-scrape"
binding = "SCRAPER"
class_name = "ScrapeWorkflow"
schedules = ["0 4 * * *"] # Every day, 04:00 UTC
