<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Dark only: `color-scheme` darkens the browser's own scrollbars, form controls and autofill before any CSS loads. -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#000000" />
		<meta name="application-name" content="PokéCards" />
		<meta name="apple-mobile-web-app-title" content="PokéCards" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<!-- Root-absolute, not `%sveltekit.assets%`: Kit renders that one relative to the document (`..`), and these links outlive a client
		     navigation, so the browser then asked `/sets/manifest.webmanifest` and got a 404. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="search" href="/opensearch.xml" type="application/opensearchdescription+xml" title="PokéCards" />
		<!-- The title, the canonical, every Open Graph tag and the JSON-LD graph come from `Seo.svelte`, never from here:
		     a second copy in this shell would ship duplicated tags on every page. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
